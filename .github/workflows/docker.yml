name: Deploy Next.js site to Docker

on: workflow_dispatch

jobs:
  build:
    name: Generate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: nextjs-app:latest
          outputs: type=docker,dest=nextjs-app.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app-docker-image
          path: nextjs-app.tar
          retention-days: 1

  deploy:
    name: Deploy Docker Image to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Import Docker Image
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app-docker-image
          path: images

      - name: Upload Docker Image
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: images/*
          target: ${{ secrets.IMAGE_DIR_PATH }}
          strip_components: 1

      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.IMAGE_DIR_PATH }}

            docker compose down
            docker load -i nextjs-app.tar
            docker compose up -d
            docker image prune -f
